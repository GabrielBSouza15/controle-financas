[build-system]
requires = ["setuptools>=69,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "controle-financas"
version = "0.1.0"
description = "Gestão local de finanças pessoais com desenvolvimento incremental."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx2>=2.13,<3",
]

# Descobrir somente o código da aplicação; não incluir testes ou documentos.
[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "static/*.mjs"]
