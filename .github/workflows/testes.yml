name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar dependências de referência
        run: python -m pip install -r requirements-dev.lock.txt
      - name: Instalar aplicação local
        run: python -m pip install --no-deps -e ".[dev]"
      - name: Testar regras e aplicação Python
        run: python -m pytest -q
      - name: Testar interface e cálculos JavaScript
        run: node --test tests/test_money_ui.mjs tests/test_settlement_money.mjs tests/test_dashboard_chart.mjs tests/chart_geometry.test.mjs tests/entry_categories.test.mjs
